capture:
  backend: auto        # auto | mss | dxcam
  target_fps: 60
  monitor: 1
detection:
  model: yolo11n.pt
  confidence: 0.35
  device: auto         # auto | cpu | cuda
  tracking: false
  smoothing_frames: 3
ui:
  preview_max_width: 960
logging:
  level: INFO
  dir: logs
hotkeys:
  emergency_stop: "<ctrl>+<alt>+q"
decision:
  tick_hz: 10.0
  anti_loop_window: 30
  anti_loop_max_repeats: 3
  hesitation_prob: 0.02
  rng_seed: 7
input:
  backend: auto        # auto | pynput | pydirectinput
  max_actions_per_second: 8.0
  roi_confine: true
  start_armed: false
  move_steps: 24
  jitter_px: 2
  reaction_min_s: 0.08
  reaction_max_s: 0.22
  keystroke_min_s: 0.03
  keystroke_max_s: 0.09
  overshoot_prob: 0.15
ocr:
  enabled: false       # opt-in: heavy optional dep + CPU cost
  labels: [button, popup, dialog]
  lang: en
  min_confidence: 0.5
behaviors_path: configs/behaviors.yaml
