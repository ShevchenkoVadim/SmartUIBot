[project]
name = "smartuibot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "PyYAML>=6.0",
    "mss>=9.0",
    "opencv-python>=4.10",
    "PyQt6>=6.7",
    "ultralytics>=8.3",
    "pynput>=1.7",
    "pydirectinput>=1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smartuibot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mss.*", "ultralytics.*", "cv2.*", "pynput.*", "pydirectinput.*", "paddleocr.*", "paddle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["model: requires downloading YOLO weights (skipped offline)"]
